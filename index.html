<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile F1 Racing</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #121212; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; touch-action: none;
        }
        #game-container {
            width: 100vw; height: 100vh; position: relative;
            background: #1b5e20; /* Более темная, насыщенная трава */
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui {
            position: absolute; top: 3%; left: 3%;
            background: rgba(0, 0, 0, 0.7); padding: 10px 15px;
            border-radius: 8px; font-size: 16px; font-weight: bold;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px); z-index: 10;
        }
        .highlight { color: #ff5252; }
        #start-hint { font-size: 12px; color: #ffb74d; margin-top: 4px; font-weight: normal; }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 8vw; font-weight: 900; color: #ffd700;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 3px 3px 0 #000;
            display: none; text-align: center; pointer-events: none; z-index: 20; width: 100%;
        }
        #message span { display: block; font-size: 5vw; color: #fff; margin-top: 8px; }

        #joystick-container {
            position: absolute; bottom: 40px; left: 30px;
            width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; touch-action: none; z-index: 15; backdrop-filter: blur(2px);
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 48px; height: 48px;
            background: radial-gradient(circle, #ff5252 0%, #b71c1c 100%);
            border: 2px solid #fff; border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        @media (min-width: 768px) {
            #ui { font-size: 20px; padding: 15px 20px; }
            #start-hint { font-size: 14px; }
            #message { font-size: 50px; }
            #message span { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            Круг: <span id="lap" class="highlight">1</span> / 5<br>
            Время: <span id="time" class="highlight">0.00</span>с
            <div id="start-hint">Потяните стик или нажмите клавиши</div>
        </div>
        <div id="message">ФИНИШ!<span id="final-time"></span></div>
        <div id="joystick-container"><div id="joystick-knob"></div></div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const uiLap = document.getElementById('lap');
        const uiTime = document.getElementById('time');
        const uiHint = document.getElementById('start-hint');
        const msg = document.getElementById('message');
        const finalTimeLabel = document.getElementById('final-time');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const MathMinDim = Math.min(canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        const trackWidth = Math.max(50, MathMinDim * 0.15);
        let baseRadius = (MathMinDim / 2) - trackWidth - 20;
        if (baseRadius < 50) baseRadius = 50;

        // --- ГЕНЕРАЦИЯ ТРАССЫ (Стиль Ф1: Плавная, без рандома) ---
        const numPoints = 150; // Больше точек для идеальной гладкости
        const points = [];

        for (let i = 0; i < numPoints; i++) {
            let angle = (i / numPoints) * Math.PI * 2;
            // Используем только плавные волны для формы "Формулы 1"
            let rMod = Math.sin(angle * 2) * 0.25 + Math.cos(angle * 3) * 0.15;
            let r = baseRadius * (1 + rMod);
            points.push({ angle, r });
        }

        function getTrackRadius(ang) {
            let normalized = ang % (Math.PI * 2);
            if (normalized < 0) normalized += Math.PI * 2;
            
            let index = (normalized / (Math.PI * 2)) * numPoints;
            let i1 = Math.floor(index);
            let i2 = (i1 + 1) % numPoints;
            let t = index - i1;
            
            return points[i1].r * (1 - t) + points[i2].r * t;
        }

        // --- НАСТРОЙКИ МАШИНКИ ---
        let startRadius = getTrackRadius(0);
        
        const car = {
            x: cx + startRadius,
            y: cy,
            angle: Math.PI / 2,
            speed: 0,
            // СКОРОСТЬ УВЕЛИЧЕНА В 5 РАЗ (* 5)
            maxSpeed: ((baseRadius * Math.PI * 2) / 550) * 5, 
            accel: 0,
            friction: 0.98, // Чуть больше скольжения на высокой скорости
            grassFriction: 0.85,
            turnSpeed: 0.1, // Увеличена поворачиваемость, чтобы вписываться в повороты на скорости
            width: trackWidth * 0.35,
            height: trackWidth * 0.16
        };
        car.accel = car.maxSpeed * 0.04;

        let laps = 1;
        const maxLaps = 5;
        let prevAngleRelative = 0;
        let gameStarted = false;
        let finished = false;
        let startTime = 0;

        function triggerGameStart() {
            if (!gameStarted && !finished) {
                gameStarted = true;
                startTime = Date.now();
                uiHint.innerText = "Гонка началась!";
                uiHint.style.color = "#81c784";
            }
        }

        // --- УПРАВЛЕНИЕ ---
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) triggerGameStart();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        const joystickBase = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        const maxJoystickRadius = 35;
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };

        function handlePointerStart(e) {
            e.preventDefault();
            joystickActive = true;
            updateJoystick(e);
            triggerGameStart();
        }

        function handlePointerMove(e) {
            if (!joystickActive) return;
            e.preventDefault();
            updateJoystick(e);
        }

        function handlePointerEnd(e) {
            e.preventDefault();
            joystickActive = false;
            joystickVector = { x: 0, y: 0 };
            joystickKnob.style.transform = `translate(-50%, -50%)`;
        }

        function updateJoystick(e) {
            const rect = joystickBase.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            if (!touch) return;
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            
            let dist = Math.hypot(dx, dy);
            if (dist > maxJoystickRadius) {
                dx = (dx / dist) * maxJoystickRadius;
                dy = (dy / dist) * maxJoystickRadius;
            }
            
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickVector.x = dx / maxJoystickRadius;
            joystickVector.y = dy / maxJoystickRadius;
        }

        joystickBase.addEventListener('touchstart', handlePointerStart, {passive: false});
        joystickBase.addEventListener('mousedown', handlePointerStart);
        window.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('touchend', handlePointerEnd);
        window.addEventListener('mouseup', handlePointerEnd);

        // --- ОТРИСОВКА ---
        function drawTrack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Трасса
            ctx.beginPath();
            for (let i = 0; i <= numPoints; i++) {
                let p = points[i % numPoints];
                let px = cx + Math.cos(p.angle) * p.r;
                let py = cy + Math.sin(p.angle) * p.r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            // Бордюры
            ctx.lineWidth = trackWidth + (trackWidth * 0.15);
            ctx.strokeStyle = '#fff'; // Внешний белый контур (Ф1 стиль)
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Поребрики (красные полосы поверх белого контура)
            ctx.setLineDash([30, 30]); // Пунктир
            ctx.strokeStyle = '#e53935'; 
            ctx.stroke();
            ctx.setLineDash([]); // Сброс пунктира

            // Асфальт
            ctx.lineWidth = trackWidth;
            ctx.strokeStyle = '#333'; // Темный свежий асфальт
            ctx.stroke();

            // ЯРКАЯ ЛИНИЯ СТАРТА/ФИНИША (Угол 0 - Справа от центра)
            ctx.save();
            let startP = points[0]; 
            let startPx = cx + Math.cos(startP.angle) * startP.r;
            let startPy = cy + Math.sin(startP.angle) * startP.r;
            
            ctx.translate(startPx, startPy);
            // Угол наклона линии перпендикулярен трассе в этой точке (вертикально)
            
            // Белая подложка линии финиша
            ctx.fillStyle = '#fff';
            ctx.fillRect(-8, -trackWidth/2, 16, trackWidth);

            // Шахматный узор линии
            let checkerSize = 8;
            for(let j = -trackWidth/2; j < trackWidth/2; j += checkerSize) {
                for(let i = -8; i < 8; i += checkerSize) {
                    ctx.fillStyle = (Math.floor(j/checkerSize) + Math.floor((i+8)/checkerSize)) % 2 === 0 ? '#000' : '#fff';
                    ctx.fillRect(i, j, checkerSize, checkerSize);
                }
            }
            ctx.restore();
        }

        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(-car.width/2 + 3, -car.height/2 + 3, car.width, car.height);

            // Болид Ф1 сверху (Узкий нос, широкие антикрылья)
            // Заднее антикрыло
            ctx.fillStyle = '#111';
            ctx.fillRect(-car.width/2 - 2, -car.height/2, 6, car.height);
            
            // Основной корпус
            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            ctx.moveTo(-car.width/2 + 4, -car.height/3);
            ctx.lineTo(car.width/2 - 4, -car.height/4);
            ctx.lineTo(car.width/2 - 4, car.height/4);
            ctx.lineTo(-car.width/2 + 4, car.height/3);
            ctx.fill();

            // Переднее антикрыло
            ctx.fillStyle = '#111';
            ctx.fillRect(car.width/2 - 4, -car.height/2, 4, car.height);

            // Кабина пилота
            ctx.fillStyle = '#000';
            ctx.fillRect(-car.width*0.1, -car.height*0.15, car.width*0.25, car.height*0.3);

            ctx.restore();
        }

        function update() {
            if (finished) return;

            let throttle = 0;
            let steer = 0;

            if (keys['ArrowUp'] || keys['KeyW']) throttle += 1;
            if (keys['ArrowDown'] || keys['KeyS']) throttle -= 1;
            if (keys['ArrowLeft'] || keys['KeyA']) steer -= 1;
            if (keys['ArrowRight'] || keys['KeyD']) steer += 1;

            if (joystickActive) {
                throttle = -joystickVector.y;
                steer = joystickVector.x;
            }

            if (throttle !== 0) car.speed += car.accel * throttle;

            let turnMod = Math.abs(car.speed / car.maxSpeed); // Чем быстрее едешь, тем лучше поворачивает
            if (turnMod > 0.1) {
                // Машина поворачивает только если движется
                car.angle += car.turnSpeed * steer * (car.speed > 0 ? 1 : -1); 
            }

            let angFromCenter = Math.atan2(car.y - cy, car.x - cx);
            let distFromCenter = Math.hypot(car.y - cy, car.x - cx);
            let trackRad = getTrackRadius(angFromCenter);

            let isOnGrass = Math.abs(distFromCenter - trackRad) > (trackWidth / 2.2);
            
            // На траве сильное замедление, так как скорость огромная
            car.speed *= isOnGrass ? car.grassFriction : car.friction;

            if (car.speed > car.maxSpeed && !isOnGrass) car.speed = car.maxSpeed;
            if (car.speed < -car.maxSpeed / 2) car.speed = -car.maxSpeed / 2;

            car.x += Math.cos(car.angle) * car.speed;
            car.y += Math.sin(car.angle) * car.speed;

            let curNormalized = angFromCenter;
            if (curNormalized < 0) curNormalized += Math.PI * 2;

            if (prevAngleRelative > 5 && curNormalized < 1) {
                if (gameStarted) {
                    laps++;
                    if (laps > maxLaps) {
                        finished = true;
                        let finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
                        uiTime.innerText = finalTime;
                        uiLap.innerText = maxLaps;
                        msg.style.display = 'block';
                        finalTimeLabel.innerText = `Время: ${finalTime} сек`;
                        uiHint.innerText = "Гонка завершена!";
                    } else {
                        uiLap.innerText = laps;
                    }
                }
            } else if (prevAngleRelative < 1 && curNormalized > 5) {
                if (gameStarted && laps > 1) {
                    laps--;
                    uiLap.innerText = laps;
                }
            }
            prevAngleRelative = curNormalized;

            if (gameStarted && !finished) {
                uiTime.innerText = ((Date.now() - startTime) / 1000).toFixed(2);
            }
        }

        function gameLoop() {
            update();
            drawTrack();
            drawCar();
            requestAnimationFrame(gameLoop);
        }

        prevAngleRelative = Math.atan2(car.y - cy, car.x - cx);
        if (prevAngleRelative < 0) prevAngleRelative += Math.PI * 2;
        
        gameLoop();
    </script>
</body>
</html>
