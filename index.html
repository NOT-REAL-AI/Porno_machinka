<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 Pro Racing</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #121212; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; touch-action: none;
        }
        #game-container {
            width: 100vw; height: 100vh; position: relative;
            background: #1b5e20;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui {
            position: absolute; top: 3%; left: 3%;
            background: rgba(0, 0, 0, 0.75); padding: 10px 15px;
            border-radius: 8px; font-size: 16px; font-weight: bold;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px); z-index: 10;
        }
        .highlight { color: #ff5252; }
        #start-hint { font-size: 12px; color: #ffb74d; margin-top: 4px; font-weight: normal; }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 8vw; font-weight: 900; color: #ffd700;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 3px 3px 0 #000;
            display: none; text-align: center; pointer-events: none; z-index: 20; width: 100%;
        }
        #message span { display: block; font-size: 5vw; color: #fff; margin-top: 8px; }

        /* РУЛЬ СЛЕВА */
        #steering-wheel {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 4px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; touch-action: none; z-index: 15;
            backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
        }
        #wheel-inner {
            width: 100%; height: 100%; position: relative;
            border-radius: 50%; transition: transform 0.05s linear;
        }
        /* Спицы руля */
        #wheel-inner::before {
            content: ''; position: absolute; top: 50%; left: 10%; right: 10%; height: 6px;
            background: rgba(255, 255, 255, 0.6); transform: translateY(-50%); border-radius: 3px;
        }
        #wheel-inner::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 36px; height: 36px;
            background: #b71c1c; border: 2px solid #fff; border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* ПЕДАЛЬ ГАЗА (РЫЧАГ) СПРАВА */
        #throttle-container {
            position: absolute; bottom: 30px; right: 30px;
            width: 60px; height: 180px;
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px; touch-action: none; z-index: 15;
            display: flex; flex-direction: column; align-items: center;
            backdrop-filter: blur(2px);
        }
        #throttle-bar-bg {
            position: absolute; bottom: 10px; width: 16px; height: 150px;
            background: rgba(255, 255, 255, 0.15); border-radius: 8px; overflow: hidden;
        }
        #throttle-fill {
            position: absolute; bottom: 0; width: 100%; height: 0%;
            background: linear-gradient(to top, #4caf50, #ffeb3b, #f44336);
            border-radius: 8px;
        }
        #throttle-knob {
            position: absolute; bottom: 0px; left: 50%;
            width: 44px; height: 32px; background: #e53935;
            border: 2px solid #fff; border-radius: 8px;
            transform: translateX(-50%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #throttle-text {
            position: absolute; top: -25px; font-size: 14px; font-weight: bold; color: #ffeb3b;
        }

        @media (min-width: 768px) {
            #ui { font-size: 20px; padding: 15px 20px; }
            #start-hint { font-size: 14px; }
            #message { font-size: 50px; }
            #message span { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            Круг: <span id="lap" class="highlight">1</span> / 5<br>
            Время: <span id="time" class="highlight">0.00</span>с
            <div id="start-hint">Поверните руль и дайте газ для старта</div>
        </div>
        <div id="message">ФИНИШ!<span id="final-time"></span></div>
        
        <!-- РУЛЬ -->
        <div id="steering-wheel">
            <div id="wheel-inner"></div>
        </div>

        <!-- РЫЧАГ ГАЗА -->
        <div id="throttle-container">
            <div id="throttle-text">0%</div>
            <div id="throttle-bar-bg"><div id="throttle-fill"></div></div>
            <div id="throttle-knob"></div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const uiLap = document.getElementById('lap');
        const uiTime = document.getElementById('time');
        const uiHint = document.getElementById('start-hint');
        const msg = document.getElementById('message');
        const finalTimeLabel = document.getElementById('final-time');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const MathMinDim = Math.min(canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        const trackWidth = Math.max(50, MathMinDim * 0.15);
        let baseRadius = (MathMinDim / 2) - trackWidth - 20;
        if (baseRadius < 50) baseRadius = 50;

        // --- ГЕНЕРАЦИЯ ТРАССЫ ---
        const numPoints = 150;
        const points = [];

        for (let i = 0; i < numPoints; i++) {
            let angle = (i / numPoints) * Math.PI * 2;
            let rMod = Math.sin(angle * 2) * 0.25 + Math.cos(angle * 3) * 0.15;
            let r = baseRadius * (1 + rMod);
            points.push({ angle, r });
        }

        function getTrackRadius(ang) {
            let normalized = ang % (Math.PI * 2);
            if (normalized < 0) normalized += Math.PI * 2;
            
            let index = (normalized / (Math.PI * 2)) * numPoints;
            let i1 = Math.floor(index);
            let i2 = (i1 + 1) % numPoints;
            let t = index - i1;
            
            return points[i1].r * (1 - t) + points[i2].r * t;
        }

        // --- МАШИНКА ---
        let startRadius = getTrackRadius(0);
        
        const car = {
            x: cx + startRadius,
            y: cy,
            angle: Math.PI / 2,
            speed: 0,
            maxSpeed: ((baseRadius * Math.PI * 2) / 550) * 5,
            turnSpeed: 0.08,
            width: trackWidth * 0.35,
            height: trackWidth * 0.16
        };

        let laps = 1;
        const maxLaps = 5;
        let prevAngleRelative = 0;
        let gameStarted = false;
        let finished = false;
        let startTime = 0;

        let throttlePercent = 0; // От 0 до 100
        let steerInput = -1;       // От -1 (влево) до 1 (вправо)

        function triggerGameStart() {
            if (!gameStarted && !finished) {
                gameStarted = true;
                startTime = Date.now();
                uiHint.innerText = "Гонка началась!";
                uiHint.style.color = "#81c784";
            }
        }

        // --- УПРАВЛЕНИЕ РУЛЕМ ---
        const wheelBase = document.getElementById('steering-wheel');
        const wheelInner = document.getElementById('wheel-inner');
        let wheelActive = false;
        let wheelCenterX = 0, wheelCenterY = 0;

        wheelBase.addEventListener('pointerdown', e => {
            e.preventDefault();
            wheelActive = true;
            const rect = wheelBase.getBoundingClientRect();
            wheelCenterX = rect.left + rect.width / 2;
            wheelCenterY = rect.top + rect.height / 2;
            updateWheel(e);
            triggerGameStart();
        });

        window.addEventListener('pointermove', e => {
            if (!wheelActive) return;
            e.preventDefault();
            updateWheel(e);
        });

        window.addEventListener('pointerup', e => {
            if (wheelActive) {
                wheelActive = false;
                steerInput = 0;
                wheelInner.style.transform = `rotate(0deg)`;
            }
        });

        function updateWheel(e) {
            const touch = e.touches ? e.touches[0] : e;
            if (!touch) return;
            let dx = touch.clientX - wheelCenterX;
            let dy = touch.clientY - wheelCenterY;
            let angleRad = Math.atan2(dy, dx);
            let angleDeg = angleRad * (180 / Math.PI) + 90;
            
            if (angleDeg > 180) angleDeg -= 360;
            if (angleDeg < -180) angleDeg += 360;
            
            // Ограничение поворота руля до 90 градусов в каждую сторону
            if (angleDeg > 90) angleDeg = 90;
            if (angleDeg < -90) angleDeg = -90;

            wheelInner.style.transform = `rotate(${angleDeg}deg)`;
            steerInput = angleDeg / 90; // Нормализация от -1 до 1
        }

        // --- УПРАВЛЕНИЕ ПЕДАЛЬЮ ГАЗА (РЫЧАГОМ) ---
        const throttleContainer = document.getElementById('throttle-container');
        const throttleKnob = document.getElementById('throttle-knob');
        const throttleFill = document.getElementById('throttle-fill');
        const throttleText = document.getElementById('throttle-text');
        const maxThrottleHeight = 150;
        let throttleActive = false;

        throttleContainer.addEventListener('pointerdown', e => {
            e.preventDefault();
            throttleActive = true;
            updateThrottle(e);
            triggerGameStart();
        });

        window.addEventListener('pointermove', e => {
            if (!throttleActive) return;
            e.preventDefault();
            updateThrottle(e);
        });

        window.addEventListener('pointerup', e => {
            throttleActive = false;
        });

        function updateThrottle(e) {
            const touch = e.touches ? e.touches[0] : e;
            if (!touch) return;
            const rect = throttleContainer.getBoundingClientRect();
            let y = rect.bottom - 10 - touch.clientY; // Снизу вверх
            
            if (y < 0) y = 0;
            if (y > maxThrottleHeight) y = maxThrottleHeight;

            throttlePercent = Math.round((y / maxThrottleHeight) * 100);
            
            throttleKnob.style.bottom = `${y}px`;
            throttleFill.style.height = `${throttlePercent}%`;
            throttleText.innerText = `${throttlePercent}%`;
        }


        // --- ОТРИСОВКА ТРАССЫ ---
        function drawTrack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            for (let i = 0; i <= numPoints; i++) {
                let p = points[i % numPoints];
                let px = cx + Math.cos(p.angle) * p.r;
                let py = cy + Math.sin(p.angle) * p.r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            // Бордюры
            ctx.lineWidth = trackWidth + (trackWidth * 0.15);
            ctx.strokeStyle = '#fff';
            ctx.lineJoin = 'round';
            ctx.stroke();

            ctx.setLineDash([30, 30]);
            ctx.strokeStyle = '#e53935'; 
            ctx.stroke();
            ctx.setLineDash([]);

            // Асфальт
            ctx.lineWidth = trackWidth;
            ctx.strokeStyle = '#333';
            ctx.stroke();

            // Линия Старт/Финиш
            ctx.save();
            let startP = points[0]; 
            let startPx = cx + Math.cos(startP.angle) * startP.r;
            let startPy = cy + Math.sin(startP.angle) * startP.r;
            ctx.translate(startPx, startPy);
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(-8, -trackWidth/2, 16, trackWidth);

            let checkerSize = 8;
            for(let j = -trackWidth/2; j < trackWidth/2; j += checkerSize) {
                for(let i = -8; i < 8; i += checkerSize) {
                    ctx.fillStyle = (Math.floor(j/checkerSize) + Math.floor((i+8)/checkerSize)) % 2 === 0 ? '#000' : '#fff';
                    ctx.fillRect(i, j, checkerSize, checkerSize);
                }
            }
            ctx.restore();
        }

        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(-car.width/2 + 3, -car.height/2 + 3, car.width, car.height);

            ctx.fillStyle = '#111';
            ctx.fillRect(-car.width/2 - 2, -car.height/2, 6, car.height);
            
            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            ctx.moveTo(-car.width/2 + 4, -car.height/3);
            ctx.lineTo(car.width/2 - 4, -car.height/4);
            ctx.lineTo(car.width/2 - 4, car.height/4);
            ctx.lineTo(-car.width/2 + 4, car.height/3);
            ctx.fill();

            ctx.fillStyle = '#111';
            ctx.fillRect(car.width/2 - 4, -car.height/2, 4, car.height);

            ctx.fillStyle = '#000';
            ctx.fillRect(-car.width*0.1, -car.height*0.15, car.width*0.25, car.height*0.3);

            ctx.restore();
        }

        // --- ЛОГИКА И СТЕНЫ ---
        function update() {
            if (finished) return;

            // Скорость напрямую зависит от положения рычага газа (0 - 100%)
            let targetSpeed = (throttlePercent / 100) * car.maxSpeed;
            // Плавный разгон/замедление
            car.speed += (targetSpeed - car.speed) * 0.1;

            if (Math.abs(car.speed) > 0.1) {
                car.angle += car.turnSpeed * steerInput * (car.speed / car.maxSpeed);
            }

            // Движение вперед
            car.x += Math.cos(car.angle) * car.speed;
            car.y += Math.sin(car.angle) * car.speed;

            // --- СТЕНЫ И ГРАНИЦЫ ТРАССЫ (ОТБОЙНИКИ) ---
            let angFromCenter = Math.atan2(car.y - cy, car.x - cx);
            let distFromCenter = Math.hypot(car.y - cy, car.x - cx);
            let trackRad = getTrackRadius(angFromCenter);

            let innerLimit = trackRad - (trackWidth / 2.2);
            let outerLimit = trackRad + (trackWidth / 2.2);

            // Если машина ударяется об внутренний или внешний отбойник трассы
            if (distFromCenter < innerLimit || distFromCenter > outerLimit) {
                // Возвращаем машину обратно на границу дороги
                let clampedDist = Math.max(innerLimit, Math.min(outerLimit, distFromCenter));
                car.x = cx + Math.cos(angFromCenter) * clampedDist;
                car.y = cy + Math.sin(angFromCenter) * clampedDist;
                
                // Гасим скорость от удара об отбойник
                car.speed *= 0.5;
                throttlePercent = Math.max(0, throttlePercent - 20); // Сбрасываем газ при ударе
                throttleKnob.style.bottom = `${(throttlePercent/100)*maxThrottleHeight}px`;
                throttleFill.style.height = `${throttlePercent}%`;
                throttleText.innerText = `${throttlePercent}%`;
            }

            // --- СИСТЕМА КРУГОВ ---
            let curNormalized = angFromCenter;
            if (curNormalized < 0) curNormalized += Math.PI * 2;

            if (prevAngleRelative > 5 && curNormalized < 1) {
                if (gameStarted) {
                    laps++;
                    if (laps > maxLaps) {
                        finished = true;
                        let finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
                        uiTime.innerText = finalTime;
                        uiLap.innerText = maxLaps;
                        msg.style.display = 'block';
                        finalTimeLabel.innerText = `Время: ${finalTime} сек`;
                        uiHint.innerText = "Гонка завершена!";
                    } else {
                        uiLap.innerText = laps;
                    }
                }
            } else if (prevAngleRelative < 1 && curNormalized > 5) {
                if (gameStarted && laps > 1) {
                    laps--;
                    uiLap.innerText = laps;
                }
            }
            prevAngleRelative = curNormalized;

            if (gameStarted && !finished) {
                uiTime.innerText = ((Date.now() - startTime) / 1000).toFixed(2);
            }
        }

        function gameLoop() {
            update();
            drawTrack();
            drawCar();
            requestAnimationFrame(gameLoop);
        }

        prevAngleRelative = Math.atan2(car.y - cy, car.x - cx);
        if (prevAngleRelative < 0) prevAngleRelative += Math.PI * 2;
        
        gameLoop();
    </script>
</body>
</html>
