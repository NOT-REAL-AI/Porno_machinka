<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 Retro 3D Racing</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; touch-action: none;
        }
        #game-container {
            width: 100vw; height: 100vh; position: relative;
            background: #111;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui {
            position: absolute; top: 3%; left: 3%;
            background: rgba(0, 0, 0, 0.75); padding: 10px 15px;
            border-radius: 8px; font-size: 16px; font-weight: bold;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px); z-index: 10;
        }
        .highlight { color: #ff5252; }
        #start-hint { font-size: 12px; color: #ffb74d; margin-top: 4px; font-weight: normal; }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 8vw; font-weight: 900; color: #ffd700;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 3px 3px 0 #000;
            display: none; text-align: center; pointer-events: none; z-index: 20; width: 100%;
        }
        #message span { display: block; font-size: 5vw; color: #fff; margin-top: 8px; }

        /* ДЖОЙСТИК СЛЕВА */
        #joystick-container {
            position: absolute; bottom: 30px; left: 30px;
            width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none; z-index: 15;
            backdrop-filter: blur(2px);
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 56px; height: 56px;
            background: radial-gradient(circle, #ff5252 0%, #b71c1c 100%);
            border: 2px solid #fff; border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* КНОПКИ ПЕРЕДАЧ СПРАВА */
        #gear-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 75px; background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px; padding: 8px; touch-action: none; z-index: 15;
            display: flex; flex-direction: column; gap: 6px;
            backdrop-filter: blur(4px);
        }
        .gear-btn {
            width: 100%; height: 38px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 8px;
            color: #fff; font-weight: bold; font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.1s, transform 0.05s;
        }
        .gear-btn:active, .gear-btn.active {
            background: #e53935; border-color: #fff; transform: scale(0.95);
        }

        @media (min-width: 768px) {
            #ui { font-size: 20px; padding: 15px 20px; }
            #start-hint { font-size: 14px; }
            #message { font-size: 50px; }
            #message span { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            Круг: <span id="lap" class="highlight">1</span> / 5<br>
            Время: <span id="time" class="highlight">0.00</span>с
            <div id="start-hint">Потяните джойстик и выберите передачу</div>
        </div>
        <div id="message">ФИНИШ!<span id="final-time"></span></div>
        
        <!-- ДЖОЙСТИК -->
        <div id="joystick-container"><div id="joystick-knob"></div></div>

        <!-- КНОПКИ ПЕРЕДАЧ -->
        <div id="gear-container">
            <div class="gear-btn" data-speed="100">100%</div>
            <div class="gear-btn" data-speed="80">80%</div>
            <div class="gear-btn" data-speed="60">60%</div>
            <div class="gear-btn" data-speed="40">40%</div>
            <div class="gear-btn active" data-speed="20">20%</div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const uiLap = document.getElementById('lap');
        const uiTime = document.getElementById('time');
        const uiHint = document.getElementById('start-hint');
        const msg = document.getElementById('message');
        const finalTimeLabel = document.getElementById('final-time');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Карта трассы (список секций с изгибами)
        const totalRoadLength = 600; // общая длина трассы в сегментах
        const roadMap = [];

        for (let i = 0; i < totalRoadLength; i++) {
            // Создаем плавные повороты трассы влево и вправо
            let curve = Math.sin(i / 30) * 2.5 + Math.cos(i / 15) * 1.5;
            roadMap.push({ curve: curve });
        }

        let playerPos = 0;      // позиция на трассе
        let playerX = 0;        // смещение влево/вправо относительно центра (-1 до 1)
        let playerSpeed = 0;
        let maxSpeed = 3.2;
        let currentThrottlePercent = 20;
        let steerInput = 0;

        let laps = 1;
        const maxLaps = 5;
        let gameStarted = false;
        let finished = false;
        let startTime = 0;

        function triggerGameStart() {
            if (!gameStarted && !finished) {
                gameStarted = true;
                startTime = Date.now();
                uiHint.innerText = "Гонка началась!";
                uiHint.style.color = "#81c784";
            }
        }

        // ДЖОЙСТИК МУЛЬТИТАЧ
        const joystickBase = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        const maxJoystickRadius = 40;
        let joystickTouchId = null;

        joystickBase.addEventListener('touchstart', e => {
            e.preventDefault();
            if (joystickTouchId === null) {
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
                triggerGameStart();
            }
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            if (joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    e.preventDefault();
                    updateJoystick(touch);
                }
            }
        }, {passive: false});

        window.addEventListener('touchend', e => {
            if (joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    joystickTouchId = null;
                    steerInput = 0;
                    joystickKnob.style.transform = `translate(-50%, -50%)`;
                }
            }
        });

        function updateJoystick(touch) {
            const rect = joystickBase.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            let dist = Math.hypot(dx, dy);
            if (dist > maxJoystickRadius) {
                dx = (dx / dist) * maxJoystickRadius;
            }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            steerInput = dx / maxJoystickRadius;
        }

        // КНОПКИ ПЕРЕДАЧ
        const gearBtns = document.querySelectorAll('.gear-btn');
        gearBtns.forEach(btn => {
            btn.addEventListener('touchstart', e => {
                e.preventDefault();
                gearBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThrottlePercent = parseInt(btn.getAttribute('data-speed'));
                triggerGameStart();
            }, {passive: false});
            btn.addEventListener('mousedown', () => {
                gearBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThrottlePercent = parseInt(btn.getAttribute('data-speed'));
                triggerGameStart();
            });
        });

        // ОТРИСОВКА РЕАЛИСТИЧНОГО ПСЕВДО-3D МИРА
        function renderRoad() {
            let width = canvas.width;
            let height = canvas.height;

            // 1. Небо
            ctx.fillStyle = '#1976d2';
            ctx.fillRect(0, 0, width, height * 0.4);

            // 2. Земля/Трава
            ctx.fillStyle = '#1b5e20';
            ctx.fillRect(0, height * 0.4, width, height * 0.6);

            let drawDistance = 120;
            let baseSegmentIndex = Math.floor(playerPos);
            
            let x = 0;
            let dx = 0;

            // Отрисовка от дальних сегментов к ближним
            let maxY = height * 0.4;

            for (let n = drawDistance; n > 0; n--) {
                let segmentIndex = (baseSegmentIndex + n) % totalRoadLength;
                let segment = roadMap[segmentIndex];

                // Накапливаем кривизну для сгиба дороги на экране
                dx += segment.curve;
                x += dx;

                let scale = n / drawDistance;
                let nextScale = (n - 1) / drawDistance;

                // Перспективные координаты
                let p1 = project(x, height * 0.4, scale, width, height);
                let p2 = project(x - segment.curve, height * 0.4, nextScale, width, height);

                if (p1.y >= maxY) {
                    let grassColor = (segmentIndex % 2 === 0) ? '#2e7d32' : '#1b5e20';
                    let rumbleColor = (segmentIndex % 4 < 2) ? '#e53935' : '#fff';
                    let roadColor = (segmentIndex % 2 === 0) ? '#424242' : '#4e4e4e';
                    let stripeColor = (segmentIndex % 4 < 2) ? '#fff' : '#424242';

                    // Трава / обочина
                    ctx.fillStyle = grassColor;
                    ctx.fillRect(0, p2.y, width, p1.y - p2.y);

                    // Ограничители (поребрики)
                    polygon(
                        p1.x - p1.w * 1.3, p1.y,
                        p1.x - p1.w, p1.y,
                        p2.x - p2.w, p2.y,
                        p2.x - p2.w * 1.3, p2.y,
                        rumbleColor
                    );
                    polygon(
                        p1.x + p1.w, p1.y,
                        p1.x + p1.w * 1.3, p1.y,
                        p2.x + p2.w * 1.3, p2.y,
                        p2.x + p2.w, p2.y,
                        rumbleColor
                    );

                    // Дорожное полотно
                    polygon(
                        p1.x - p1.w, p1.y,
                        p1.x + p1.w, p1.y,
                        p2.x + p2.w, p2.y,
                        p2.x - p2.w, p2.y,
                        roadColor
                    );

                    // Разделительная полоса по центру
                    polygon(
                        p1.x - p1.w * 0.1, p1.y,
                        p1.x + p1.w * 0.1, p1.y,
                        p2.x + p2.w * 0.1, p2.y,
                        p2.x - p2.w * 0.1, p2.y,
                        stripeColor
                    );

                    maxY = p1.y;
                }
            }

            // Машинка игрока на переднем плане
            drawCar(width, height);
        }

        function project(roadX, horizonY, scale, width, height) {
            let cameraX = playerX * width * 0.5;
            let px = (width / 2) + (roadX * width * 0.15) - (cameraX * scale);
            let py = horizonY + (1 - scale) * (height * 0.6);
            let pw = scale * (width * 0.45);
            return { x: px, y: py, w: pw };
        }

        function polygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3);
            ctx.lineTo(x4, y4);
            ctx.closePath();
            ctx.fill();
        }

        function drawCar(w, h) {
            let cx = w / 2;
            let cy = h - 120;

            // Тень
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(cx - 70, cy + 40, 140, 30);

            // Заднее антикрыло
            ctx.fillStyle = '#111';
            ctx.fillRect(cx - 65, cy - 10, 130, 18);

            // Корпус болида (красный)
            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            ctx.moveTo(cx - 50, cy + 50);
            ctx.lineTo(cx - 35, cy - 10);
            ctx.lineTo(cx + 35, cy - 10);
            ctx.lineTo(cx + 50, cy + 50);
            ctx.closePath();
            ctx.fill();

            // Яркий желтый носовой обтекатель спереди (четко виден)
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.moveTo(cx - 20, cy + 20);
            ctx.lineTo(cx + 20, cy + 20);
            ctx.lineTo(cx + 12, cy + 90);
            ctx.lineTo(cx - 12, cy + 90);
            ctx.closePath();
            ctx.fill();

            // Шлем пилота
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx, cy + 10, 14, 0, Math.PI * 2);
            ctx.fill();
        }

        // ОБНОВЛЕНИЕ ФИЗИКИ
        function update() {
            if (finished) return;

            let targetSpeed = (currentThrottlePercent / 100) * maxSpeed;
            playerSpeed += (targetSpeed - playerSpeed) * 0.1;

            if (gameStarted) {
                playerPos += playerSpeed;
            }

            // Поворот руля смещает машину влево/вправо
            playerX += steerInput * 0.035 * (playerSpeed / maxSpeed);

            // Вылет за пределы дороги
            if (playerX < -1.4 || playerX > 1.4) {
                playerX = Math.max(-1.4, Math.min(1.4, playerX));
                playerSpeed *= 0.3; // Удар об отбойник замедляет
            }

            // Просчет кругов
            if (playerPos >= totalRoadLength) {
                playerPos -= totalRoadLength;
                laps++;
                if (laps > maxLaps) {
                    finished = true;
                    let finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
                    uiTime.innerText = finalTime;
                    uiLap.innerText = maxLaps;
                    msg.style.display = 'block';
                    finalTimeLabel.innerText = `Время: ${finalTime} сек`;
                    uiHint.innerText = "Гонка завершена!";
                } else {
                    uiLap.innerText = laps;
                }
            }

            if (gameStarted && !finished) {
                uiTime.innerText = ((Date.now() - startTime) / 1000).toFixed(2);
            }
        }

        function gameLoop() {
            update();
            renderRoad();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
