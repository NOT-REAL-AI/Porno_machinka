<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 Pro Racing - Joystick</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #121212; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; touch-action: none;
        }
        #game-container {
            width: 100vw; height: 100vh; position: relative;
            background: #1b5e20;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui {
            position: absolute; top: 3%; left: 3%;
            background: rgba(0, 0, 0, 0.75); padding: 10px 15px;
            border-radius: 8px; font-size: 16px; font-weight: bold;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px); z-index: 10;
        }
        .highlight { color: #ff5252; }
        #start-hint { font-size: 12px; color: #ffb74d; margin-top: 4px; font-weight: normal; }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 8vw; font-weight: 900; color: #ffd700;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 3px 3px 0 #000;
            display: none; text-align: center; pointer-events: none; z-index: 20; width: 100%;
        }
        #message span { display: block; font-size: 5vw; color: #fff; margin-top: 8px; }

        /* ДЖОЙСТИК СЛЕВА */
        #joystick-container {
            position: absolute; bottom: 30px; left: 30px;
            width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none; z-index: 15;
            backdrop-filter: blur(2px);
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 56px; height: 56px;
            background: radial-gradient(circle, #ff5252 0%, #b71c1c 100%);
            border: 2px solid #fff; border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* ПАНЕЛЬ ПЕРЕДАЧ СПРАВА */
        #gear-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 75px; background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px; padding: 8px; touch-action: none; z-index: 15;
            display: flex; flex-direction: column; gap: 6px;
            backdrop-filter: blur(4px);
        }
        .gear-btn {
            width: 100%; height: 38px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 8px;
            color: #fff; font-weight: bold; font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.1s, transform 0.05s;
        }
        .gear-btn:active, .gear-btn.active {
            background: #e53935; border-color: #fff; transform: scale(0.95);
        }

        @media (min-width: 768px) {
            #ui { font-size: 20px; padding: 15px 20px; }
            #start-hint { font-size: 14px; }
            #message { font-size: 50px; }
            #message span { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            Круг: <span id="lap" class="highlight">1</span> / 5<br>
            Время: <span id="time" class="highlight">0.00</span>с
            <div id="start-hint">Потяните джойстик и выберите передачу</div>
        </div>
        <div id="message">ФИНИШ!<span id="final-time"></span></div>
        
        <!-- ДЖОЙСТИК -->
        <div id="joystick-container"><div id="joystick-knob"></div></div>

        <!-- КНОПКИ ПЕРЕДАЧ -->
        <div id="gear-container">
            <div class="gear-btn" data-speed="100">100%</div>
            <div class="gear-btn" data-speed="80">80%</div>
            <div class="gear-btn" data-speed="60">60%</div>
            <div class="gear-btn" data-speed="40">40%</div>
            <div class="gear-btn active" data-speed="20">20%</div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const uiLap = document.getElementById('lap');
        const uiTime = document.getElementById('time');
        const uiHint = document.getElementById('start-hint');
        const msg = document.getElementById('message');
        const finalTimeLabel = document.getElementById('final-time');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const MathMinDim = Math.min(canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // ШИРОКАЯ ТРАССА (исходная плавная форма Ф1)
        const trackWidth = Math.max(70, MathMinDim * 0.20); 
        let baseRadius = (MathMinDim / 2) - trackWidth - 25;
        if (baseRadius < 50) baseRadius = 50;

        const numPoints = 150;
        const points = [];

        for (let i = 0; i < numPoints; i++) {
            let angle = (i / numPoints) * Math.PI * 2;
            let rMod = Math.sin(angle * 2) * 0.25 + Math.cos(angle * 3) * 0.15;
            let r = baseRadius * (1 + rMod);
            points.push({ angle, r });
        }

        function getTrackRadius(ang) {
            let normalized = ang % (Math.PI * 2);
            if (normalized < 0) normalized += Math.PI * 2;
            
            let index = (normalized / (Math.PI * 2)) * numPoints;
            let i1 = Math.floor(index);
            let i2 = (i1 + 1) % numPoints;
            let t = index - i1;
            
            return points[i1].r * (1 - t) + points[i2].r * t;
        }

        // --- МАШИНКА ---
        let startRadius = getTrackRadius(0);
        
        const car = {
            x: cx + startRadius,
            y: cy,
            angle: Math.PI / 2,
            speed: 0,
            maxSpeed: ((baseRadius * Math.PI * 2) / 550) * 5,
            turnSpeed: 0.09,
            width: trackWidth * 0.4,
            height: trackWidth * 0.18
        };

        let laps = 1;
        const maxLaps = 5;
        let prevAngleRelative = 0;
        let gameStarted = false;
        let finished = false;
        let startTime = 0;

        let currentThrottlePercent = 20;
        let steerInput = 0;

        function triggerGameStart() {
            if (!gameStarted && !finished) {
                gameStarted = true;
                startTime = Date.now();
                uiHint.innerText = "Гонка началась!";
                uiHint.style.color = "#81c784";
            }
        }

        // --- МУЛЬТИТАЧ ДЖОЙСТИК ---
        const joystickBase = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        const maxJoystickRadius = 40;
        let joystickTouchId = null;

        joystickBase.addEventListener('touchstart', e => {
            e.preventDefault();
            if (joystickTouchId === null) {
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
                triggerGameStart();
            }
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            if (joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    e.preventDefault();
                    updateJoystick(touch);
                }
            }
        }, {passive: false});

        window.addEventListener('touchend', e => {
            if (joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    joystickTouchId = null;
                    steerInput = 0;
                    joystickKnob.style.transform = `translate(-50%, -50%)`;
                }
            }
        });

        function updateJoystick(touch) {
            const rect = joystickBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            
            let dist = Math.hypot(dx, dy);
            if (dist > maxJoystickRadius) {
                dx = (dx / dist) * maxJoystickRadius;
                dy = (dy / dist) * maxJoystickRadius;
            }
            
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            steerInput = dx / maxJoystickRadius; // Поворот вправо/влево
        }

        // --- КНОПКИ ПЕРЕДАЧ ---
        const gearBtns = document.querySelectorAll('.gear-btn');
        gearBtns.forEach(btn => {
            btn.addEventListener('touchstart', e => {
                e.preventDefault();
                gearBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThrottlePercent = parseInt(btn.getAttribute('data-speed'));
                triggerGameStart();
            }, {passive: false});
            
            btn.addEventListener('mousedown', () => {
                gearBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThrottlePercent = parseInt(btn.getAttribute('data-speed'));
                triggerGameStart();
            });
        });

        // --- ОТРИСОВКА ТРАССЫ ---
        function drawTrack() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            for (let i = 0; i <= numPoints; i++) {
                let p = points[i % numPoints];
                let px = cx + Math.cos(p.angle) * p.r;
                let py = cy + Math.sin(p.angle) * p.r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            ctx.lineWidth = trackWidth + (trackWidth * 0.15);
            ctx.strokeStyle = '#fff';
            ctx.lineJoin = 'round';
            ctx.stroke();

            ctx.setLineDash([30, 30]);
            ctx.strokeStyle = '#e53935'; 
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.lineWidth = trackWidth;
            ctx.strokeStyle = '#333';
            ctx.stroke();

            // Линия Старт/Финиш
            ctx.save();
            let startP = points[0]; 
            let startPx = cx + Math.cos(startP.angle) * startP.r;
            let startPy = cy + Math.sin(startP.angle) * startP.r;
            ctx.translate(startPx, startPy);
            
            ctx.fillStyle = '#fff';
            ctx.fillRect(-8, -trackWidth/2, 16, trackWidth);

            let checkerSize = 8;
            for(let j = -trackWidth/2; j < trackWidth/2; j += checkerSize) {
                for(let i = -8; i < 8; i += checkerSize) {
                    ctx.fillStyle = (Math.floor(j/checkerSize) + Math.floor((i+8)/checkerSize)) % 2 === 0 ? '#000' : '#fff';
                    ctx.fillRect(i, j, checkerSize, checkerSize);
                }
            }
            ctx.restore();
        }

        // --- МАШИНКА С ОЧЕНЬ ЧЕТКИМ ПЕРЕДОМ ---
        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // Тень
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(-car.width/2 + 3, -car.height/2 + 3, car.width, car.height);

            // ЗАДНЕЕ АНТИКРЫЛО
            ctx.fillStyle = '#111';
            ctx.fillRect(-car.width/2 - 4, -car.height/2 - 1, 6, car.height + 2);

            // ОСНОВНОЙ КОРПУС
            ctx.fillStyle = '#e53935';
            ctx.beginPath();
            ctx.moveTo(-car.width/2 + 4, -car.height/3);
            ctx.lineTo(car.width/2 - 6, -car.height/4);
            ctx.lineTo(car.width/2, 0); // Острый нос
            ctx.lineTo(car.width/2 - 6, car.height/4);
            ctx.lineTo(-car.width/2 + 4, car.height/3);
            ctx.closePath();
            ctx.fill();

            // ЯРКИЙ НОСОВОЙ ОБТЕКАТЕЛЬ (для максимальной отчетливости спереди)
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.moveTo(car.width/2 - 8, -car.height/6);
            ctx.lineTo(car.width/2, 0);
            ctx.lineTo(car.width/2 - 8, car.height/6);
            ctx.closePath();
            ctx.fill();

            // ПЕРЕДНЕЕ ШИРОКОЕ АНТИКРЫЛО
            ctx.fillStyle = '#111';
            ctx.fillRect(car.width/2 - 4, -car.height/2 - 2, 5, car.height + 4);

            // КАБИНА ПИЛОТА И ШЛЕМ
            ctx.fillStyle = '#000';
            ctx.fillRect(-car.width * 0.05, -car.height * 0.15, car.width * 0.25, car.height * 0.3);
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(car.width * 0.08, 0, car.height * 0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // --- ЛОГИКА И СТЕНЫ ---
        function update() {
            if (finished) return;

            let targetSpeed = (currentThrottlePercent / 100) * car.maxSpeed;
            car.speed += (targetSpeed - car.speed) * 0.1;

            if (Math.abs(car.speed) > 0.1) {
                car.angle += car.turnSpeed * steerInput * (car.speed / car.maxSpeed);
            }

            car.x += Math.cos(car.angle) * car.speed;
            car.y += Math.sin(car.angle) * car.speed;

            // --- СТЕНЫ И ГРАНИЦЫ ТРАССЫ ---
            let angFromCenter = Math.atan2(car.y - cy, car.x - cx);
            let distFromCenter = Math.hypot(car.y - cy, car.x - cx);
            let trackRad = getTrackRadius(angFromCenter);

            let innerLimit = trackRad - (trackWidth / 2.2);
            let outerLimit = trackRad + (trackWidth / 2.2);

            if (distFromCenter < innerLimit || distFromCenter > outerLimit) {
                let clampedDist = Math.max(innerLimit, Math.min(outerLimit, distFromCenter));
                car.x = cx + Math.cos(angFromCenter) * clampedDist;
                car.y = cy + Math.sin(angFromCenter) * clampedDist;
                
                car.speed *= 0.4; // Замедление при ударе об отбойник
            }

            // --- КРУГИ ---
            let curNormalized = angFromCenter;
            if (curNormalized < 0) curNormalized += Math.PI * 2;

            if (prevAngleRelative > 5 && curNormalized < 1) {
                if (gameStarted) {
                    laps++;
                    if (laps > maxLaps) {
                        finished = true;
                        let finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
                        uiTime.innerText = finalTime;
                        uiLap.innerText = maxLaps;
                        msg.style.display = 'block';
                        finalTimeLabel.innerText = `Время: ${finalTime} сек`;
                        uiHint.innerText = "Гонка завершена!";
                    } else {
                        uiLap.innerText = laps;
                    }
                }
            } else if (prevAngleRelative < 1 && curNormalized > 5) {
                if (gameStarted && laps > 1) {
                    laps--;
                    uiLap.innerText = laps;
                }
            }
            prevAngleRelative = curNormalized;

            if (gameStarted && !finished) {
                uiTime.innerText = ((Date.now() - startTime) / 1000).toFixed(2);
            }
        }

        function gameLoop() {
            update();
            drawTrack();
            drawCar();
            requestAnimationFrame(gameLoop);
        }

        prevAngleRelative = Math.atan2(car.y - cy, car.x - cx);
        if (prevAngleRelative < 0) prevAngleRelative += Math.PI * 2;
        
        gameLoop();
    </script>
</body>
</html>
