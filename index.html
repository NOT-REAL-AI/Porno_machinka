<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 3D First Person</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; touch-action: none;
        }
        #game-container {
            width: 100vw; height: 100vh; position: relative;
            background: linear-gradient(to bottom, #1976d2 0%, #42a5f5 50%, #1b5e20 50%);
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui {
            position: absolute; top: 3%; left: 3%;
            background: rgba(0, 0, 0, 0.75); padding: 10px 15px;
            border-radius: 8px; font-size: 16px; font-weight: bold;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(4px); z-index: 10;
        }
        .highlight { color: #ff5252; }
        #start-hint { font-size: 12px; color: #ffb74d; margin-top: 4px; font-weight: normal; }
        
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 8vw; font-weight: 900; color: #ffd700;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.9), 3px 3px 0 #000;
            display: none; text-align: center; pointer-events: none; z-index: 20; width: 100%;
        }
        #message span { display: block; font-size: 5vw; color: #fff; margin-top: 8px; }

        /* ДЖОЙСТИК СЛЕВА */
        #joystick-container {
            position: absolute; bottom: 30px; left: 30px;
            width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none; z-index: 15;
            backdrop-filter: blur(2px);
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 56px; height: 56px;
            background: radial-gradient(circle, #ff5252 0%, #b71c1c 100%);
            border: 2px solid #fff; border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* КНОПКИ ПЕРЕДАЧ СПРАВА */
        #gear-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 75px; background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px; padding: 8px; touch-action: none; z-index: 15;
            display: flex; flex-direction: column; gap: 6px;
            backdrop-filter: blur(4px);
        }
        .gear-btn {
            width: 100%; height: 38px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 8px;
            color: #fff; font-weight: bold; font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.1s, transform 0.05s;
        }
        .gear-btn:active, .gear-btn.active {
            background: #e53935; border-color: #fff; transform: scale(0.95);
        }

        @media (min-width: 768px) {
            #ui { font-size: 20px; padding: 15px 20px; }
            #start-hint { font-size: 14px; }
            #message { font-size: 50px; }
            #message span { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            Круг: <span id="lap" class="highlight">1</span> / 5<br>
            Время: <span id="time" class="highlight">0.00</span>с
            <div id="start-hint">Потяните джойстик и выберите передачу</div>
        </div>
        <div id="message">ФИНИШ!<span id="final-time"></span></div>
        
        <!-- ДЖОЙСТИК -->
        <div id="joystick-container"><div id="joystick-knob"></div></div>

        <!-- КНОПКИ ПЕРЕДАЧ -->
        <div id="gear-container">
            <div class="gear-btn" data-speed="100">100%</div>
            <div class="gear-btn" data-speed="80">80%</div>
            <div class="gear-btn" data-speed="60">60%</div>
            <div class="gear-btn" data-speed="40">40%</div>
            <div class="gear-btn active" data-speed="20">20%</div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const uiLap = document.getElementById('lap');
        const uiTime = document.getElementById('time');
        const uiHint = document.getElementById('start-hint');
        const msg = document.getElementById('message');
        const finalTimeLabel = document.getElementById('final-time');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const numPoints = 150;
        const points = [];
        const baseRadius = 350;

        for (let i = 0; i < numPoints; i++) {
            let angle = (i / numPoints) * Math.PI * 2;
            let rMod = Math.sin(angle * 2) * 0.25 + Math.cos(angle * 3) * 0.15;
            let r = baseRadius * (1 + rMod);
            points.push({ angle, r });
        }

        function getTrackRadius(ang) {
            let normalized = ang % (Math.PI * 2);
            if (normalized < 0) normalized += Math.PI * 2;
            let index = (normalized / (Math.PI * 2)) * numPoints;
            let i1 = Math.floor(index);
            let i2 = (i1 + 1) % numPoints;
            let t = index - i1;
            return points[i1].r * (1 - t) + points[i2].r * t;
        }

        // Игрок / Машина
        const car = {
            x: 0,
            y: 0,
            angle: Math.PI / 2,
            speed: 0,
            maxSpeed: 3.5,
            turnSpeed: 0.045,
            trackDist: baseRadius
        };

        let laps = 1;
        const maxLaps = 5;
        let gameStarted = false;
        let finished = false;
        let startTime = 0;
        let currentThrottlePercent = 20;
        let steerInput = 0;

        // Начальная позиция на трассе
        car.x = Math.cos(0) * baseRadius;
        car.y = Math.sin(0) * baseRadius;

        function triggerGameStart() {
            if (!gameStarted && !finished) {
                gameStarted = true;
                startTime = Date.now();
                uiHint.innerText = "Гонка началась!";
                uiHint.style.color = "#81c784";
            }
        }

        // ДЖОЙСТИК МУЛЬТИТАЧ
        const joystickBase = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        const maxJoystickRadius = 40;
        let joystickTouchId = null;

        joystickBase.addEventListener('touchstart', e => {
            e.preventDefault();
            if (joystickTouchId === null) {
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
                triggerGameStart();
            }
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            if (joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    e.preventDefault();
                    updateJoystick(touch);
                }
            }
        }, {passive: false});

        window.addEventListener('touchend', e => {
            if (joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    joystickTouchId = null;
                    steerInput = 0;
                    joystickKnob.style.transform = `translate(-50%, -50%)`;
                }
            }
        });

        function updateJoystick(touch) {
            const rect = joystickBase.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            let dist = Math.hypot(dx, dy);
            if (dist > maxJoystickRadius) {
                dx = (dx / dist) * maxJoystickRadius;
            }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            steerInput = dx / maxJoystickRadius;
        }

        // КНОПКИ ПЕРЕДАЧ
        const gearBtns = document.querySelectorAll('.gear-btn');
        gearBtns.forEach(btn => {
            btn.addEventListener('touchstart', e => {
                e.preventDefault();
                gearBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThrottlePercent = parseInt(btn.getAttribute('data-speed'));
                triggerGameStart();
            }, {passive: false});
            btn.addEventListener('mousedown', () => {
                gearBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentThrottlePercent = parseInt(btn.getAttribute('data-speed'));
                triggerGameStart();
            });
        });

        // 3D РЕНДЕР ОТ ПЕРВОГО ЛИЦА
        function render3D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let w = canvas.width;
            let h = canvas.height;
            let horizon = h * 0.45;

            // Небо
            ctx.fillStyle = '#1976d2';
            ctx.fillRect(0, 0, w, horizon);
            // Земля/трава
            ctx.fillStyle = '#1b5e20';
            ctx.fillRect(0, horizon, w, h - horizon);

            // Рендер сегментов дороги в перспективе (Raycasting / Pseudo-3D)
            let drawDistance = 80;
            let segmentLength = 2;
            
            let playerAngle = Math.atan2(car.y, car.x);
            let trackWidth = 140;

            let renderList = [];

            for (let i = drawDistance; i > 0; i--) {
                let sampleAngle = playerAngle + (i * 0.015 * (car.speed > 0 ? 1 : 0));
                let trackRad = getTrackRadius(sampleAngle);
                
                let cx = Math.cos(sampleAngle) * trackRad;
                let cy = Math.sin(sampleAngle) * trackRad;

                // Проекция на экран
                let p1 = project(cx, cy, i, w, h, horizon, trackWidth);
                let p2 = project(cx, cy, i + segmentLength, w, h, horizon, trackWidth);

                if (p1.clip) {
                    renderList.push({ p1, i, sampleAngle });
                }
            }

            // Отрисовка дороги от дальних сегментов к ближним
            for (let idx = renderList.length - 1; idx >= 0; idx--) {
                let item = renderList[idx];
                let p = item.p1;
                let nextP = idx > 0 ? renderList[idx - 1].p1 : p;

                // Цвет асфальта меняется для эффекта движения
                let isEven = Math.floor(item.i + Date.now() / 50) % 2 === 0;
                ctx.fillStyle = isEven ? '#333' : '#3a3a3a';

                // Дорожное полотно
                ctx.beginPath();
                ctx.moveTo(p.left, p.y);
                ctx.lineTo(p.right, p.y);
                ctx.lineTo(nextP.right, nextP.y);
                ctx.lineTo(nextP.left, nextP.y);
                ctx.closePath();
                ctx.fill();

                // Боковые отбойники (поребрики с поворотами)
                ctx.fillStyle = isEven ? '#e53935' : '#fff';
                // Левый бортик
                ctx.fillRect(p.left - 10, p.y, 10, Math.max(1, p.y - nextP.y));
                // Правый бортик
                ctx.fillRect(p.right, p.y, 10, Math.max(1, p.y - nextP.y));
            }

            // Отрисовка капота и носа болида от первого лица внизу экрана
            drawCockpit(w, h);
        }

        function project(worldX, worldY, depth, w, h, horizon, trackWidth) {
            // Относительные координаты игрока
            let relX = worldX - car.x;
            let relY = worldY - car.y;

            // Поворот по углу взгляда машины
            let cos = Math.cos(-car.angle);
            let sin = Math.sin(-car.angle);
            let camX = relX * cos - relY * sin;
            let camY = relX * sin + relY * cos;

            if (camY <= 0) return { clip: false };

            let scale = 300 / camY;
            let screenX = w / 2 + (camX * scale);
            let screenY = horizon + (camY * scale * 0.2); // Эффект наклона дороги

            let halfW = (trackWidth * scale) / 2;

            return {
                left: screenX - halfW,
                right: screenX + halfW,
                y: screenY,
                clip: true
            };
        }

        function drawCockpit(w, h) {
            // Капот машины снизу
            ctx.fillStyle = '#b71c1c';
            ctx.beginPath();
            ctx.moveTo(w * 0.2, h);
            ctx.lineTo(w * 0.4, h * 0.7);
            ctx.lineTo(w * 0.6, h * 0.7);
            ctx.lineTo(w * 0.8, h);
            ctx.closePath();
            ctx.fill();

            // Желтый носовой обтекатель
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.moveTo(w * 0.45, h * 0.7);
            ctx.lineTo(w * 0.55, h * 0.7);
            ctx.lineTo(w * 0.52, h * 0.5);
            ctx.lineTo(w * 0.48, h * 0.5);
            ctx.closePath();
            ctx.fill();

            // Руль внизу
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(w / 2, h + 100, 180, Math.PI, 0);
            ctx.fill();
            ctx.strokeStyle = '#e53935';
            ctx.lineWidth = 12;
            ctx.stroke();
        }

        // ОБНОВЛЕНИЕ ФИЗИКИ
        function update() {
            if (finished) return;

            let targetSpeed = (currentThrottlePercent / 100) * car.maxSpeed;
            car.speed += (targetSpeed - car.speed) * 0.1;

            car.angle += car.turnSpeed * steerInput * (car.speed / car.maxSpeed);

            car.x += Math.cos(car.angle) * car.speed * 15;
            car.y += Math.sin(car.angle) * car.speed * 15;

            // Проверка границ трассы
            let angFromCenter = Math.atan2(car.y, car.x);
            let distFromCenter = Math.hypot(car.x, car.y);
            let trackRad = getTrackRadius(angFromCenter);

            let innerLimit = trackRad - 55;
            let outerLimit = trackRad + 55;

            if (distFromCenter < innerLimit || distFromCenter > outerLimit) {
                let clampedDist = Math.max(innerLimit, Math.min(outerLimit, distFromCenter));
                car.x = Math.cos(angFromCenter) * clampedDist;
                car.y = Math.sin(angFromCenter) * clampedDist;
                car.speed *= 0.3; // Удар об отбойник
            }

            // Система кругов
            let curNormalized = angFromCenter;
            if (curNormalized < 0) curNormalized += Math.PI * 2;

            if (car.trackDist > 5 && curNormalized < 1) {
                if (gameStarted) {
                    laps++;
                    if (laps > maxLaps) {
                        finished = true;
                        let finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
                        uiTime.innerText = finalTime;
                        uiLap.innerText = maxLaps;
                        msg.style.display = 'block';
                        finalTimeLabel.innerText = `Время: ${finalTime} сек`;
                        uiHint.innerText = "Гонка завершена!";
                    } else {
                        uiLap.innerText = laps;
                    }
                }
            }
            car.trackDist = curNormalized;

            if (gameStarted && !finished) {
                uiTime.innerText = ((Date.now() - startTime) / 1000).toFixed(2);
            }
        }

        function gameLoop() {
            update();
            render3D();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
